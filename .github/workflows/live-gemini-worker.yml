name: Live Gemini Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'acceptance/stage4/stage16/test_live_gemini_worker.py'
      - 'acceptance/stage4/stage16/live_worker_evidence.py'
      - 'synapse/experiments/gold/stage15/telemetry.py'
      - '.github/workflows/live-gemini-worker.yml'

permissions:
  contents: read

concurrency:
  group: live-gemini-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gemini-worker-connection:
    name: Live Gemini agent continuation
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned worker profile
        run: python -m pip install -e . pytest
      - name: Exercise the existing worker with two live tool turns
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pytest -q acceptance/stage4/stage16/test_live_gemini_worker.py --basetemp "$RUNNER_TEMP/gemini-worker"
      - name: Preserve physical provider receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gemini-worker-${{ github.run_id }}
          path: ${{ runner.temp }}/gemini-worker
          include-hidden-files: true
          retention-days: 14
