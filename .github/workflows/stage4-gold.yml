      fail-fast: false
      matrix:
        include:
          - shard: baseline-capture
            file: acceptance/stage4/stage16/test_baseline_capture_acceptance.py
          - shard: paired-execution
            file: acceptance/stage4/stage16/test_paired_execution_acceptance.py
          - shard: task-result
            file: acceptance/stage4/stage16/test_task_result_acceptance.py
          - shard: mechanism-evidence
            file: acceptance/stage4/stage16/test_mechanism_evidence_acceptance.py
          - shard: gold-dispatch-recovery
            file: acceptance/stage4/stage16/test_gold_dispatch_recovery_acceptance.py
          - shard: baseline-dispatch-recovery
            file: acceptance/stage4/stage16/test_baseline_dispatch_recovery_acceptance.py
          - shard: replicates
            file: acceptance/stage4/stage16/test_replicates_acceptance.py
          - shard: fingerprint
            file: acceptance/stage4/stage16/test_fingerprint_acceptance.py
          - shard: source-ingestion
            file: acceptance/stage4/stage16/test_source_ingestion_acceptance.py
          - shard: source-recipe-refusal
            file: acceptance/stage4/stage16/test_source_recipe_refusal_acceptance.py
          - shard: source-runtime-outcome
            file: acceptance/stage4/stage16/test_source_runtime_outcome_acceptance.py
          - shard: source-recovery
            file: acceptance/stage4/stage16/test_source_recovery_acceptance.py
          - shard: source-retention
            file: acceptance/stage4/stage16/test_source_retention_acceptance.py
          - shard: source-experience
            file: acceptance/stage4/stage16/test_source_experience_acceptance.py
          - shard: source-study
            file: acceptance/stage4/stage16/test_source_study_acceptance.py
          - shard: source-experience-recovery
            file: acceptance/stage4/stage16/test_source_experience_recovery_acceptance.py
          - shard: source-experience-publication
            file: acceptance/stage4/stage16/test_source_experience_publication_acceptance.py
          - shard: source-consumer
            file: acceptance/stage4/stage16/test_source_consumer_acceptance.py
          - shard: source-snapshot
            file: acceptance/stage4/stage16/test_source_snapshot_acceptance.py
          - shard: source-experience-consumer
            file: acceptance/stage4/stage16/test_source_experience_consumer_acceptance.py
          - shard: source-consumer-refusal
            file: acceptance/stage4/stage16/test_source_consumer_refusal_acceptance.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the frozen real worker and SDK profile
        run: python -m pip install -e '.[gold-worker]' pytest
      - name: Configure git for repository acceptance
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"
      - name: Run one independent Stage 16 acceptance file
        run: python -m pytest -q -p no:randomly "${{ matrix.file }}"

  gold-stage16-mutations:
    name: gold-stage16-mutation-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - S16-MUT-FINGERPRINT
          - S16-MUT-SELECTED-REPLICATES
          - S16-MUT-CACHE-AS-REUSE
          - S16-MUT-UNEARNED-ECONOMICS
          - S16-MUT-PRODUCT-BYPASS
          - S16-MUT-MISSING-DURATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the frozen real worker and SDK profile
        run: python -m pip install -e '.[gold-worker]' pytest
      - name: Configure git for repository acceptance
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"
      - name: Baseline, weaken, kill and verify restoration in an isolated checkout
        run: >
          python -B -m acceptance.stage4.stage16.mutations
          --case "${{ matrix.case }}"
          --output "${{ runner.temp }}/stage16-mutation"
      - name: Retain exact falsification and restoration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage16-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/stage16-mutation
          if-no-files-found: error

  gold-slow:
    name: gold-slow
    if: ${{ always() }}
    needs:
      - gold-slow-core
      - gold-slow-retrieval
      - gold-slow-replay
      - gold-slow-vm-adapter
      - gold-slow-od10
      - gold-slow-e1
      - gold-stage10-fast
      - gold-stage10-heavy
      - gold-stage11-fast
      - gold-stage11-heavy
      - gold-stage12-heavy
      - gold-stage13-heavy
      - gold-stage14-heavy
      - gold-stage15-heavy
      - gold-stage16-heavy
      - gold-stage16-mutations
    runs-on: ubuntu-latest
    steps:
      - name: Require every slow shard to succeed
        env:
          CORE_RESULT: ${{ needs['gold-slow-core'].result }}
          RETRIEVAL_RESULT: ${{ needs['gold-slow-retrieval'].result }}
          REPLAY_RESULT: ${{ needs['gold-slow-replay'].result }}
          VM_ADAPTER_RESULT: ${{ needs['gold-slow-vm-adapter'].result }}
          OD10_RESULT: ${{ needs['gold-slow-od10'].result }}
          E1_RESULT: ${{ needs['gold-slow-e1'].result }}
          STAGE10_FAST_RESULT: ${{ needs['gold-stage10-fast'].result }}
          STAGE10_HEAVY_RESULT: ${{ needs['gold-stage10-heavy'].result }}
          STAGE11_FAST_RESULT: ${{ needs['gold-stage11-fast'].result }}
          STAGE11_HEAVY_RESULT: ${{ needs['gold-stage11-heavy'].result }}
          STAGE12_HEAVY_RESULT: ${{ needs['gold-stage12-heavy'].result }}
          STAGE13_HEAVY_RESULT: ${{ needs['gold-stage13-heavy'].result }}
          STAGE14_HEAVY_RESULT: ${{ needs['gold-stage14-heavy'].result }}
          STAGE15_HEAVY_RESULT: ${{ needs['gold-stage15-heavy'].result }}
          STAGE16_HEAVY_RESULT: ${{ needs['gold-stage16-heavy'].result }}
          STAGE16_MUTATIONS_RESULT: ${{ needs['gold-stage16-mutations'].result }}
        run: |
          for result in \
            "$CORE_RESULT" \
            "$RETRIEVAL_RESULT" \
            "$REPLAY_RESULT" \
            "$VM_ADAPTER_RESULT" \
            "$OD10_RESULT" \
            "$E1_RESULT" \
            "$STAGE10_FAST_RESULT" \
            "$STAGE10_HEAVY_RESULT" \
            "$STAGE11_FAST_RESULT" \
            "$STAGE11_HEAVY_RESULT" \
            "$STAGE12_HEAVY_RESULT" \
            "$STAGE13_HEAVY_RESULT" \
            "$STAGE14_HEAVY_RESULT" \
            "$STAGE15_HEAVY_RESULT" \
            "$STAGE16_HEAVY_RESULT" \
            "$STAGE16_MUTATIONS_RESULT"
          do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
