          tests/test_stage4_gold_activities.py
          tests/test_stage4_gold_activity_provenance.py
          tests/test_replay_determinism_model.py
          acceptance/stage4/stage12/test_outcome_contract.py
          acceptance/stage4/stage12/test_status_matrix.py
          acceptance/stage4/stage12/test_reusable_authority_contract.py
          acceptance/stage4/stage13/test_write_gate_contract.py
