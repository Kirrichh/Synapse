name: Stage 4 Gold

# Patch 7+8 had no CI at all: the only workflows that ran on a pull request
# covered durable execution, version sync and a postgres provider. Every suite
# result for §21 and §22 was therefore a number one person had run locally and
# nobody else could reproduce — which is not evidence, and was correctly
# declined as such in review.
#
# The suites are split by cost rather than by subject. The compatibility and
# retrieval suites build real git repositories per harness and take roughly a
# quarter of an hour; the rest run in seconds. Putting them in one job would
# make every push wait on the slowest thing in the tree, and a check people
# learn to ignore protects nothing.
#
# The replay suite belongs to the slow half for the same reason: every case
# crosses the §22 point-of-use barrier against real stores under a real
# coordinator, and each crossing is a fresh attempt with its own Stage 3
# evidence. It was absent from both jobs when it landed, so a green Stage 4 Gold
# check said nothing at all about Patch 9 — which is how it stayed absent.

on:
  pull_request:
  workflow_dispatch:

jobs:
  gold-fast:
    name: gold-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run the Stage 4 Gold suites that do not shell out to git
        run: >
          python -m pytest -q -p no:randomly
          tests/test_cvm_llm_request_pending_envelope.py
          tests/test_stage4_gold_admission.py
          tests/test_stage4_gold_admission_journal.py
          tests/test_stage4_gold_admission_store.py
          tests/test_stage4_gold_architecture.py
          tests/test_stage4_gold_behavior.py
          tests/test_stage4_gold_bindings.py
          tests/test_stage4_gold_canonical_entrypoint.py
          tests/test_stage4_gold_canonicalization.py
          tests/test_stage4_gold_compatibility_store.py
          tests/test_stage4_gold_contracts.py
          tests/test_stage4_gold_coordination.py
          tests/test_stage4_gold_dependency_direction.py
          tests/test_stage4_gold_knowledge_snapshot.py
          tests/test_stage4_gold_library.py
          tests/test_stage4_gold_library_program_artifact.py
          tests/test_stage4_gold_library_admission.py
          tests/test_stage4_gold_lifecycle.py
          tests/test_stage4_gold_persistence.py
          tests/test_stage4_gold_provenance.py
          tests/test_stage4_gold_snapshot_gate_vocabulary.py
          tests/test_stage4_gold_taint.py
          tests/test_stage4_gold_activities.py
          tests/test_stage4_gold_activity_provenance.py
          tests/test_replay_determinism_model.py

  gold-slow-core:
    name: gold-slow-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run the Stage 4 Gold suites that build repositories
        run: >
          python -m pytest -q -p no:randomly
          tests/test_stage4_gold_acceptance_boundary.py
          tests/test_stage4_gold_compatibility.py
          tests/test_stage4_gold_compiler_binding.py
          tests/test_stage4_gold_consumption_evidence.py

  gold-slow-retrieval:
    name: gold-slow-retrieval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run the Stage 4 Gold retrieval suite
        run: >
          python -m pytest -q -p no:randomly
          tests/test_stage4_gold_retrieval.py

  gold-slow-replay:
    name: gold-slow-replay-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: contract
            file: tests/test_stage4_gold_replay_contract.py
          - shard: execution
            file: tests/test_stage4_gold_replay_execution.py
          - shard: resume
            file: tests/test_stage4_gold_replay_resume.py
          - shard: result-authority
            file: tests/test_stage4_gold_replay_result_authority.py
          - shard: admission-scope
            file: tests/test_stage4_gold_replay_admission_scope.py
          - shard: admission-authority
            file: tests/test_stage4_gold_replay_admission_authority.py
          - shard: admission-mutants
            file: tests/test_stage4_gold_replay_admission_mutants.py
          - shard: recorded-bytes
            file: tests/test_stage4_gold_replay_recorded_bytes.py
          - shard: durable-authority
            file: tests/test_stage4_gold_replay_durable_authority.py
          - shard: dispatch-safety
            file: tests/test_stage4_gold_replay_dispatch_safety.py
          - shard: permit-budget
            file: tests/test_stage4_gold_replay_permit_budget.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run one independent Stage 4 Gold replay shard
        run: python -m pytest -q -p no:randomly "${{ matrix.file }}"

  gold-slow-vm-adapter:
    name: gold-slow-vm-adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run the Stage 4 replay VM adapter acceptance suite
        run: >
          python -m pytest -q -p no:randomly
          tests/test_stage4_replay_vm_adapter_acceptance.py

  gold-slow-od10:
    name: gold-slow-od10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run the Stage 4 OD-10 execution conformance suite
        run: >
          python -m pytest -q -p no:randomly
          tests/test_stage4_od10_execution_conformance.py

  gold-slow-e1:
    name: gold-slow-e1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for the binding fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run the Stage 4 replay E1 lifecycle acceptance suite
        run: >
          python -m pytest -q -p no:randomly
          tests/test_stage4_replay_e1_lifecycle_acceptance.py

  gold-stage10-fast:
    name: gold-stage10-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run the Stage 10 semantic acceptance layer
        run: >
          python -m pytest -q -p no:randomly
          acceptance/stage4/stage10/test_scope_and_intent_acceptance.py
          acceptance/stage4/stage10/test_plan_authority_acceptance.py
          acceptance/stage4/stage10/test_plan_contract_acceptance.py
          acceptance/stage4/stage10/test_record_store_authority.py
          acceptance/stage4/stage10/test_mutation_resistance.py

  gold-stage10-heavy:
    name: gold-stage10-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: worker-process
            file: acceptance/stage4/stage10/test_worker_transport_process.py
          - shard: persistence-recovery
            file: acceptance/stage4/stage10/test_persistence_crash_recovery.py
          - shard: canonical-integration
            file: acceptance/stage4/stage10/test_canonical_stage10_integration.py
          - shard: context-admission
            file: acceptance/stage4/stage10/test_context_admission_boundary.py
          - shard: context-codec
            file: acceptance/stage4/stage10/test_context_codec_acceptance.py
          - shard: delivery-influence
            file: acceptance/stage4/stage10/test_delivery_influence_authority.py
          - shard: replay-context
            file: acceptance/stage4/stage10/test_replay_context_boundary.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for repository-backed acceptance fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run one independent Stage 10 heavy acceptance shard
        run: python -m pytest -q -p no:randomly "${{ matrix.file }}"

  gold-stage11-fast:
    name: gold-stage11-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run the Stage 11 decision and record acceptance
        run: >
          python -m pytest -q -p no:randomly
          acceptance/stage4/stage11/test_stop_policy_acceptance.py
          acceptance/stage4/stage11/test_run_records_acceptance.py
          acceptance/stage4/stage11/test_composition_mutation_acceptance.py
          acceptance/stage4/stage11/test_project_connect_acceptance.py
          acceptance/stage4/stage11/test_continuation_basis_acceptance.py

  gold-stage11-heavy:
    name: gold-stage11-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: attempt-chain
            file: acceptance/stage4/stage11/test_attempt_chain_acceptance.py
          - shard: attempt-chain-refusals
            file: acceptance/stage4/stage11/test_attempt_chain_refusals_acceptance.py
          - shard: run-lifecycle
            file: acceptance/stage4/stage11/test_run_lifecycle_acceptance.py
          - shard: candidate-substitution
            file: acceptance/stage4/stage11/test_candidate_substitution_acceptance.py
          - shard: consumption-barrier
            file: acceptance/stage4/stage11/test_consumption_barrier_acceptance.py
          - shard: delivery-unavailable
            file: acceptance/stage4/stage11/test_delivery_unavailable_acceptance.py
          - shard: knowledge-dependency-unavailable
            file: acceptance/stage4/stage11/test_knowledge_dependency_unavailable_acceptance.py
          - shard: reused-causal-evidence
            file: acceptance/stage4/stage11/test_reused_causal_evidence_acceptance.py
          - shard: delivery-started-recovery
            file: acceptance/stage4/stage11/test_delivery_started_recovery_acceptance.py
          - shard: worker-completed-recovery
            file: acceptance/stage4/stage11/test_worker_completed_recovery_acceptance.py
          - shard: c1-started-recovery
            file: acceptance/stage4/stage11/test_c1_started_recovery_acceptance.py
          - shard: c1-durable-row-recovery
            file: acceptance/stage4/stage11/test_c1_durable_row_recovery_acceptance.py
          - shard: c1-completed-recovery
            file: acceptance/stage4/stage11/test_c1_completed_recovery_acceptance.py
          - shard: terminal-recovery
            file: acceptance/stage4/stage11/test_terminal_recovery_acceptance.py
          - shard: continue-decision-restart
            file: acceptance/stage4/stage11/test_continue_decision_restart_acceptance.py
          - shard: c1-unresolved
            file: acceptance/stage4/stage11/test_c1_unresolved_acceptance.py
          - shard: c1-infrastructure
            file: acceptance/stage4/stage11/test_c1_infrastructure_acceptance.py
          - shard: c1-fallback
            file: acceptance/stage4/stage11/test_c1_fallback_acceptance.py
          - shard: delivery-progress-mutation
            file: acceptance/stage4/stage11/test_delivery_progress_mutation_acceptance.py
          - shard: c1-publication-mutation
            file: acceptance/stage4/stage11/test_c1_publication_mutation_acceptance.py
          - shard: interrupted-prefix-mutation
            file: acceptance/stage4/stage11/test_interrupted_prefix_mutation_acceptance.py
          - shard: checkpoint-ref-mutation
            file: acceptance/stage4/stage11/test_checkpoint_ref_mutation_acceptance.py
          - shard: decision-policy-mutation
            file: acceptance/stage4/stage11/test_decision_policy_mutation_acceptance.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Configure git for repository-backed acceptance fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Stage 4 Gold CI"

      - name: Run one independent Stage 11 heavy acceptance shard
        run: python -m pytest -q -p no:randomly "${{ matrix.file }}"

  gold-slow:
    name: gold-slow
    if: ${{ always() }}
    needs:
      - gold-slow-core
      - gold-slow-retrieval
      - gold-slow-replay
      - gold-slow-vm-adapter
      - gold-slow-od10
      - gold-slow-e1
      - gold-stage10-fast
      - gold-stage10-heavy
      - gold-stage11-fast
      - gold-stage11-heavy
    runs-on: ubuntu-latest
    steps:
      - name: Require every slow shard to succeed
        env:
          CORE_RESULT: ${{ needs['gold-slow-core'].result }}
          RETRIEVAL_RESULT: ${{ needs['gold-slow-retrieval'].result }}
          REPLAY_RESULT: ${{ needs['gold-slow-replay'].result }}
          VM_ADAPTER_RESULT: ${{ needs['gold-slow-vm-adapter'].result }}
          OD10_RESULT: ${{ needs['gold-slow-od10'].result }}
          E1_RESULT: ${{ needs['gold-slow-e1'].result }}
          STAGE10_FAST_RESULT: ${{ needs['gold-stage10-fast'].result }}
          STAGE10_HEAVY_RESULT: ${{ needs['gold-stage10-heavy'].result }}
          STAGE11_FAST_RESULT: ${{ needs['gold-stage11-fast'].result }}
          STAGE11_HEAVY_RESULT: ${{ needs['gold-stage11-heavy'].result }}
        run: |
          for result in \
            "$CORE_RESULT" \
            "$RETRIEVAL_RESULT" \
            "$REPLAY_RESULT" \
            "$VM_ADAPTER_RESULT" \
            "$OD10_RESULT" \
            "$E1_RESULT" \
            "$STAGE10_FAST_RESULT" \
            "$STAGE10_HEAVY_RESULT" \
            "$STAGE11_FAST_RESULT" \
            "$STAGE11_HEAVY_RESULT"
          do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
