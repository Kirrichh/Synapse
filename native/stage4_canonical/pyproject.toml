[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "synapse-stage4-canonical"
version = "0.1.0"
description = "Optional native Stage 4 canonicalization kernel for Synapse"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
bindings = "pyo3"
module-name = "_stage4_native"
strip = true
