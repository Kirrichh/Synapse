[package]
name = "synapse-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[lib]
name = "synapse_desktop"
path = "src/lib.rs"

[[bin]]
name = "synapse-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri = { version = "2", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
sha2 = "0.10"
